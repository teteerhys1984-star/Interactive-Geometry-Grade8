name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages to publish without a personal token.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent run per ref: queued pushes to main still supersede an
# in-progress deployment as before, while pull-request checks run in their own
# group and can never cancel a deployment (and vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate: every push to main, every pull request targeting it, and
  # manual dispatches.
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 20 is end-of-life and unsupported by the toolchain: vitest 5 needs
      # >= 22.12 and jsdom 30 needs >= 22.22.2, so the test step crashes on it.
      # The runtime is pinned once in .nvmrc so CI matches local development.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--include=dev` is explicit: the build and the typecheck both need
      # devDependencies (`@types/node`, `vitest/globals`,
      # `@testing-library/jest-dom`), which npm omits when the runner
      # environment looks production-like (NODE_ENV=production or
      # npm_config_production=true).
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (includes source-fidelity suite)
        run: npm run test

  # Build and deploy only for main (push or manual dispatch). Pull requests
  # stop at the verify gate above and never touch the Pages environment.
  build:
    name: Build
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm run build` starts with `tsc -b`, which resolves the `types`
      # entries in tsconfig (`node`, `vitest/globals`,
      # `@testing-library/jest-dom`). Without this install step the build job
      # fails with "Cannot find type definition file for ...".
      - name: Install dependencies
        run: npm ci --include=dev

      # Vite `base` is '/Interactive-Geometry-Grade8/' (see vite.config.ts),
      # matching the GitHub Pages project-site URL.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
