  RTL layout. Every LTR island (maths, diagrams, code) opts out explicitly.
-->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="منصة تفاعلية لتعلّم الهندسة للصف الثامن، مبنية على الكتاب المدرسي."
    />
    <title>الهندسة — الصف الثامن</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
